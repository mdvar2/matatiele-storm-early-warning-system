name: Scheduled Matatiele Storm Check
'on':
  workflow_dispatch:
    inputs:
      send_test_sms:
        description: 'Send one connectivity SMS: NO WEATHER WARNING (verified trial recipient only)'
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '12 * * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: matatiele-hourly-sms
  cancel-in-progress: false
jobs:
  predict-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # LIVE automatic SMS explicitly approved by the project owner.
      ENABLE_REAL_SMS: 'true'
      GH_TOKEN: ${{ github.token }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      ALERT_TO_NUMBERS: ${{ secrets.ALERT_TO_NUMBERS }}
      SMS_TEST_CONFIRMED: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_sms == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate worker compilation
        run: python -m py_compile 18_scheduled_sms_worker.py 12_live_forecast_and_predict.py sms_alert.py
      - name: Genuine forecast and automatic SMS check
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.send_test_sms != true }}
        env:
          RUN_RECORD_FILE: ${{ runner.temp }}/run_record.json
        run: python 18_scheduled_sms_worker.py --live
      - name: Manual connectivity test (NO WEATHER WARNING)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_sms == true }}
        env:
          RUN_RECORD_FILE: ${{ runner.temp }}/run_record.json
        run: python 18_scheduled_sms_worker.py --test-sms
      # Monitoring only: runs after every outcome, cannot fail the job and never sends SMS.
      - name: Publish sanitised run record (monitoring only)
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          RUN_RECORD_FILE: ${{ runner.temp }}/run_record.json
          # Job summary only. Set to 'true' to also post to the public [RUN-LOG] issue.
          RUN_RECORD_PUBLISH: 'false'
        run: python 19_publish_run_record.py
