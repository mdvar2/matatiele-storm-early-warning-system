name: Scheduled Matatiele Storm Check
'on':
  workflow_dispatch:
    inputs:
      send_test_sms:
        description: 'Send one connectivity SMS: NO WEATHER WARNING (verified trial recipient only)'
        type: boolean
        required: true
        default: false
      trigger_source:
        description: 'Who started this run: manual (people) or external_scheduler (hourly trigger)'
        type: choice
        required: false
        default: manual
        options:
          - manual
          - external_scheduler
      scheduled_for:
        description: 'Optional UTC slot from the external scheduler, e.g. 2026-10-30T07:05:00Z'
        type: string
        required: false
        default: ''
  schedule:
    - cron: '12 * * * *'
permissions:
  contents: read
  issues: write
  # Read-only: lets a later run confirm that the holder of an abandoned SMS lock has ended.
  actions: read
concurrency:
  group: matatiele-hourly-sms
  cancel-in-progress: false
jobs:
  predict-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # LIVE automatic SMS explicitly approved by the project owner.
      ENABLE_REAL_SMS: 'true'
      GH_TOKEN: ${{ github.token }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      ALERT_TO_NUMBERS: ${{ secrets.ALERT_TO_NUMBERS }}
      SMS_TEST_CONFIRMED: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_sms == true }}
    steps:
      - uses: actions/checkout@v7
      # Monitoring only (R2): HB-1 start ping. Skipped if the secret is unset; cannot fail the job.
      - name: Heartbeat - run started (monitoring only)
        continue-on-error: true
        timeout-minutes: 2
        env:
          HC_EXECUTION_URL: ${{ secrets.HC_EXECUTION_URL }}
        run: python3 20_send_heartbeat.py --start
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate worker compilation
        run: python -m py_compile 18_scheduled_sms_worker.py 12_live_forecast_and_predict.py sms_alert.py
      - name: Genuine forecast and automatic SMS check
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.send_test_sms != true }}
        env:
          RUN_RECORD_FILE: ${{ runner.temp }}/run_record.json
          RUN_TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'github_schedule' || inputs.trigger_source || 'manual' }}
          RUN_SCHEDULED_FOR: ${{ inputs.scheduled_for }}
          # Resident subscribers: off unless the repository variable SUBSCRIBER_ALERTS_ENABLED is 'true'.
          SUBSCRIBER_ALERTS_ENABLED: ${{ vars.SUBSCRIBER_ALERTS_ENABLED || 'false' }}
          SMS_DELIVERY_MODE: twilio
          SUBSCRIBER_STORE: github
          SUBSCRIBER_STORE_REPO: ${{ vars.SUBSCRIBER_STORE_REPO }}
          SUBSCRIBER_STORE_TOKEN: ${{ secrets.SUBSCRIBER_STORE_TOKEN }}
          SUBSCRIBER_ENCRYPTION_KEY: ${{ secrets.SUBSCRIBER_ENCRYPTION_KEY }}
          SUBSCRIBER_HASH_KEY: ${{ secrets.SUBSCRIBER_HASH_KEY }}
        run: python 18_scheduled_sms_worker.py --live
      - name: Manual connectivity test (NO WEATHER WARNING)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_sms == true }}
        env:
          RUN_RECORD_FILE: ${{ runner.temp }}/run_record.json
          RUN_TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'github_schedule' || inputs.trigger_source || 'manual' }}
          RUN_SCHEDULED_FOR: ${{ inputs.scheduled_for }}
        run: python 18_scheduled_sms_worker.py --test-sms
      # Monitoring only: confirms the token can create/delete lock labels and read run status.
      # Uses a throwaway "sms-probe:" label, never an SMS lock or ledger issue; cannot fail the job.
      - name: Probe duplicate-lock permissions (monitoring only)
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          RUN_RECORD_FILE: ${{ runner.temp }}/run_record.json
        run: python3 22_probe_lock_permissions.py
      # Monitoring only: runs after every outcome, cannot fail the job and never sends SMS.
      - name: Publish sanitised run record (monitoring only)
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          RUN_RECORD_FILE: ${{ runner.temp }}/run_record.json
          # Also post each sanitised record to the public [RUN-LOG] YYYY-MM issue: the durable prediction log the
          # dashboard reads (no phone numbers, message content or provider identifiers).
          RUN_RECORD_PUBLISH: 'true'
        run: python 19_publish_run_record.py
      # Monitoring only (R2): heartbeats derived from the R1 run record. Never sends SMS; cannot fail the job.
      - name: Heartbeat - report outcome (monitoring only)
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          RUN_RECORD_FILE: ${{ runner.temp }}/run_record.json
          HC_EXECUTION_URL: ${{ secrets.HC_EXECUTION_URL }}
          HC_FORECAST_URL: ${{ secrets.HC_FORECAST_URL }}
          HC_FAILURE_URL: ${{ secrets.HC_FAILURE_URL }}
          HC_WARNING_URL: ${{ secrets.HC_WARNING_URL }}
        run: python3 20_send_heartbeat.py
