name: Scheduled Matatiele Storm Check
'on':
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: matatiele-hourly-sms
  cancel-in-progress: false
jobs:
  predict-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Deliberately disabled until the project owner explicitly approves live SMS.
      ENABLE_REAL_SMS: 'false'
      GH_TOKEN: ${{ github.token }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      ALERT_TO_NUMBERS: ${{ secrets.ALERT_TO_NUMBERS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate worker compilation
        run: python -m py_compile 18_scheduled_sms_worker.py 12_live_forecast_and_predict.py sms_alert.py
      - name: Genuine forecast and model check (SMS disabled)
        run: python 18_scheduled_sms_worker.py --dry-run
