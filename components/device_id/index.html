<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>device</title></head>
<body style="margin:0">
<script>
// Anonymous device identifier for warning acknowledgements: a random value kept in this
// browser's local storage, so a reload cannot acknowledge the same warning twice.
// The server stores only a keyed hash of it. Nothing else is read or sent.
(function () {
  var KEY = 'msrsews-device-id', sent = false, id = null;
  try {
    id = window.localStorage.getItem(KEY);
    if (!id) {
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() :
        Array.from(crypto.getRandomValues(new Uint8Array(16)), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      window.localStorage.setItem(KEY, id);
    }
  } catch (e) { id = 'unavailable'; }  // storage blocked: the page falls back to this visit only
  function post(type, extra) {
    window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra || {}), '*');
  }
  window.addEventListener('message', function (event) {
    if (event.data && event.data.type === 'streamlit:render' && !sent) {
      sent = true;
      post('streamlit:setComponentValue', {value: id, dataType: 'json'});
    }
  });
  post('streamlit:componentReady', {apiVersion: 1});
  post('streamlit:setFrameHeight', {height: 0});
})();
</script>
</body>
</html>
