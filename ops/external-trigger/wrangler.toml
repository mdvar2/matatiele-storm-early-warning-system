# Cloudflare Worker for the external hourly trigger (R3). ACTIVE: deployed 29 Oct 2026 with owner approval.
# Every hourly invocation starts a genuine production warning check. Redeploy: npx wrangler deploy
# Disable: set crons = [] and redeploy (or delete the Worker), then revoke GITHUB_DISPATCH_TOKEN.
name = "matatiele-storm-trigger"
main = "worker.js"
compatibility_date = "2025-01-01"
# No public URL: the Worker only runs on its cron schedule.
workers_dev = false
preview_urls = false

[triggers]
# Minute 5 of every hour, UTC. GitHub's own cron (minute 12) stays enabled as a backup.
crons = ["5 * * * *"]

[vars]
GITHUB_REPOSITORY = "mdvar2/matatiele-storm-early-warning-system"
WORKFLOW_FILE = "scheduled-storm-sms.yml"
GITHUB_REF = "main"
